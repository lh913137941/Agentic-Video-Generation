[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-video-generation"
version = "0.1.0"
description = "Storyboard-driven video generation and rough-cut composition MVP"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.27,<1",
  "pydantic>=2.5,<3",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
ui = ["gradio>=5,<7"]
asr = ["faster-whisper>=1.1,<2"]
v2v = ["fal-client>=0.7"]
test = ["pytest>=8,<10"]

[project.scripts]
agentic-video-api = "agentic_video.api:main"
agentic-video-ui = "agentic_video.ui:main"
agentic-video-mvp = "agentic_video.mvp_ui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentic_video = ["assets/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
